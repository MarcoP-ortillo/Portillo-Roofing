  <!-- Chimney accents -->
  <rect x="1300" y="430" width="40" height="140" fill="#2C3E50"/>
  <rect x="720" y="470" width="34" height="120" fill="#2C3E50"/>
  <text x="800" y="820" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" fill="#ECF0F1" opacity="0.75">Photo coming soon</text>
