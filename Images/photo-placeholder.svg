<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Portillo Roofing standing-seam metal roof pattern">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C3E50"/>
      <stop offset="1" stop-color="#1B2733"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g>
    <rect x="0" y="0" width="100" height="600" fill="url(#panel)"/>
    <rect x="200" y="0" width="100" height="600" fill="url(#panel)"/>
    <rect x="400" y="0" width="100" height="600" fill="url(#panel)"/>
    <rect x="600" y="0" width="100" height="600" fill="url(#panel)"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="3">
    <line x1="100" y1="0" x2="100" y2="600"/><line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/><line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>
  <rect x="0" y="288" width="800" height="6" fill="#E67E22"/>
  <rect x="0" y="294" width="800" height="3" fill="#E67E22" fill-opacity="0.35"/>
  <text x="400" y="352" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="6" fill="#ffffff" fill-opacity="0.9">PORTILLO ROOFING</text>
</svg>
